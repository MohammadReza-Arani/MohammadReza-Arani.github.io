<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Academic Graduation Cap Group -->
  <g filter="url(#subtleShadow)">
    <!-- Cap Skull Base / Underside Arc -->
    <path d="M 148,248 L 148,328 C 148,396 364,396 364,328 L 364,248 L 256,298 Z" fill="#e2e8f0"/>

    <!-- Mortarboard Diamond Top -->
    <polygon points="256,128 444,212 256,296 68,212" fill="#ffffff"/>

    <!-- Center Button Top -->
    <ellipse cx="256" cy="212" rx="14" ry="9" fill="#0284c7"/>

    <!-- Golden Tassel Cord -->
    <path d="M 256,212 C 340,218 406,236 414,286" fill="none" stroke="url(#tasselGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Tassel Ornament / Band -->
    <circle cx="414" cy="286" r="9" fill="#d97706"/>

    <!-- Tassel Brush Fringe -->
    <polygon points="408,292 420,292 426,358 402,358" fill="url(#tasselGrad)"/>
    <ellipse cx="414" cy="358" rx="12" ry="4" fill="#d97706"/>
  </g>
</svg>